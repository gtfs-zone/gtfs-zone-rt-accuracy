name: Check

# On a push to a branch or a pull request: runs the node check, and on a pull
# request the commit check. Deploy workflows call this workflow before they
# build.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: gtfs-zone/.github/.github/workflows/node-check.yml@d8f10454d1c5156283f096ebded47d4b56af80f5 # main

  commits:
    if: github.event_name == 'pull_request'
    uses: gtfs-zone/.github/.github/workflows/commit-check.yml@d8f10454d1c5156283f096ebded47d4b56af80f5 # main
